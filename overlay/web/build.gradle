import org.teavm.gradle.api.OptimizationLevel

plugins {
    id 'com.github.xpenatan.gdx-teavm' version '1.6.1'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
// gdx-teavm 1.6.1 web artifacts are published for Java 17.
// Keep upstream/core on Java 11; only the browser platform module targets 17.
java.sourceCompatibility = java.targetCompatibility = JavaVersion.VERSION_17

dependencies {
    implementation project(':core')

    // The upstream SPD-classes module keeps gdx-freetype as an implementation
    // dependency, so its API is not exposed transitively to this launcher.
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-web:1.6.1"
    implementation "com.github.xpenatan.gdx-teavm:gdx-controllers-web:1.6.1"
}

gdxTeaVM {
    assets.from(file("../core/src/main/assets"))

    // Keep the plugin's reachable-class reflection scan, but do not register
    // the entire game packages. Broad package reflection makes TeaVM's
    // dependency graph explode and is unnecessary for classes already
    // reachable through Shattered's class literals/generator tables.

    js {
        mainClass.set("com.shatteredpixel.shatteredpixeldungeon.web.WebLauncher")
        htmlTitle.set(appName)
        htmlWidth.set(1280)
        htmlHeight.set(720)
        targetFileName.set("shattered-pixel-dungeon.js")
        optimization.set(OptimizationLevel.BALANCED)
        fastGlobalAnalysis.set(true)
        // TeaVM runs out-of-process. Give dependency analysis a dedicated heap.
        processMemory.set(4096)
        obfuscated.set(false)
    }
}

tasks.register('yandexDist') {
    dependsOn 'gdx_teavm_web_js_build'

    doLast {
        def generatedRoot = file("$buildDir/dist/js/webapp")
        if (!generatedRoot.isDirectory()) {
            throw new GradleException("TeaVM web output not found: $generatedRoot")
        }

        def yandexRoot = file("$buildDir/yandex")
        delete yandexRoot
        copy {
            from generatedRoot
            into yandexRoot
        }

        def index = file("$yandexRoot/index.html")
        if (!index.isFile()) {
            throw new GradleException("Generated web build has no index.html")
        }

        def html = index.getText('UTF-8')
        if (!html.contains('src="/sdk.js"')) {
            html = html.replace(
                    '</head>',
                    '''        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <!-- Yandex Games SDK loader. Must be loaded before YaGames.init(). -->
        <script src="/sdk.js"></script>
    </head>''')
        }
        index.write(html, 'UTF-8')
    }
}
