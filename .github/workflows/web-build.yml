name: Build Yandex Games bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port overlay
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare pinned upstream worktree
        run: bash scripts/prepare-worktree.sh

      - name: Build Yandex bundle
        run: bash scripts/build-yandex.sh

      - name: Upload Yandex bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPixelDungeonWeb-Yandex
          path: .work/ShatteredPixelDungeonWeb-Yandex.zip
          if-no-files-found: error

      - name: Smoke test browser startup
        run: bash scripts/smoke-yandex.sh
